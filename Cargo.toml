[package]
name = "slate"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/SynrgStudio/slate"

[dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
dirs-next = "2.0.0"
# Seek's client, carrying Seek 0.5.1 for machines without it (Seek is GPL-3.0).
seek-client = { git = "https://github.com/SynrgStudio/seek", rev = "020b1418c47b05f7d87c07b8c6b83c532a43799e", features = ["bundled"] }
memchr = "2"
# Blocks on wgpu setup futures (GPU prewarm); already used by eframe.
pollster = "0.4"
mimalloc = { version = "0.1", default-features = false }
raw-window-handle = "0.6"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
eframe = { version = "0.34.2", default-features = false, features = ["default_fonts", "glow", "x11"] }

# Embeds assets/slate.ico as the .exe icon (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[features]
default = ["wgpu"]
# wgpu renderer (Direct3D 12 flip model on Windows), the default at runtime.
# SLATE_RENDERER=glow forces OpenGL; it is also the fallback if wgpu fails.
wgpu = ["eframe/wgpu"]

# Debug builds stay pleasant to *use*: dependencies (egui, glow, sqlite...) are
# compiled optimized once and cached, while Slate itself keeps fast incremental
# debug compiles.
[profile.dev.package."*"]
opt-level = 3

# Release: whole-program optimization for the shipped binary.
[profile.release]
lto = "thin"
codegen-units = 1
